<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>배경 설정</title>
  <style>
    :root {
      --bg: #1c1c1e;
      --bar: #2a2a2e;
      --fg: #f2f2f7;
      --muted: #9a9aa2;
      --accent: #ff77c2;      /* Our Notes pink */
      --line: rgba(255,255,255,0.12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 14px -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    #grid {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 20px;
    }
    .band {
      margin-bottom: 26px;
    }
    .band-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .band-head img {
      width: 26px; height: 26px; object-fit: contain;
    }
    .band-head h2 {
      font-size: 17px; font-weight: 600; margin: 0;
    }
    .band-head .pool-btn {
      margin-left: 6px;
      background: none; border: none; color: var(--accent);
      cursor: pointer; font-size: 13px; padding: 2px 4px;
    }
    .band-head .pool-btn:hover { text-decoration: underline; }
    .tiles {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }
    .tile {
      cursor: pointer;
      border: none; background: none; padding: 0; color: inherit;
      text-align: left;
    }
    .thumb-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.06);
    }
    .thumb-wrap.selected { border: 3px solid var(--accent); }
    .thumb-wrap.unpooled { opacity: 0.45; }
    .thumb-wrap img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .badge {
      position: absolute; top: 6px; right: 6px;
      width: 24px; height: 24px; border-radius: 50%;
      display: none; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700;
    }
    .badge.check { display: flex; background: var(--accent); color: #fff; }
    .badge.ring  { display: flex; background: rgba(0,0,0,0.35); color: #fff; border: 2px solid #fff; }
    .tile .name {
      display: flex; align-items: center; gap: 6px;
      margin-top: 6px; font-size: 13px;
    }
    .tile .name.current { font-weight: 600; }
    .tile .playing {
      color: var(--accent); font-size: 11px; font-weight: 700;
    }
    footer {
      flex: 0 0 auto;
      border-top: 1px solid var(--line);
      background: var(--bar);
      padding: 14px 20px;
    }
    .toggles {
      display: flex; gap: 26px; flex-wrap: wrap; align-items: flex-start;
    }
    .toggle {
      display: flex; gap: 8px; align-items: flex-start; cursor: pointer;
    }
    .toggle input { margin-top: 3px; }
    .toggle .title { font-weight: 600; }
    .toggle .caption { color: var(--muted); font-size: 12px; }
    .interval {
      display: flex; flex-direction: column; gap: 2px;
    }
    .interval label { font-weight: 600; }
    .interval select {
      background: #333; color: var(--fg); border: 1px solid var(--line);
      border-radius: 6px; padding: 3px 6px;
    }
    .interval select:disabled { opacity: 0.4; }
    .status {
      display: flex; align-items: center; gap: 14px;
      margin-top: 12px; color: var(--muted); font-size: 13px;
    }
    .status .egg { color: var(--accent); }
    .status .current-name { margin-left: auto; }
    .status .warn { color: #ffb040; }
  </style>
</head>
<body>
  <div id="grid" aria-label="장면 선택"></div>
  <footer>
    <div class="toggles">
      <label class="toggle">
        <input type="checkbox" id="chk-characters">
        <span><span class="title">캐릭터 표시</span><br><span class="caption">어느 배경을 선택하든 적용됩니다</span></span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="chk-parallax">
        <span><span class="title">커서 따라 시점 이동</span><br><span class="caption">마우스 위치로 카메라가 움직입니다</span></span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="chk-shuffle">
        <span><span class="title">장면 셔플</span><br><span class="caption">선택한 장면을 돌아가며 보여줍니다</span></span>
      </label>
      <div class="interval">
        <label for="sel-interval">변경 주기</label>
        <select id="sel-interval"></select>
      </div>
    </div>
    <div class="status">
      <span id="pool-count"></span>
      <span id="pool-empty" class="warn" style="display:none">· 선택한 장면이 없어 셔플이 멈춰 있습니다</span>
      <span id="egg" class="egg"></span>
      <span id="current" class="current-name"></span>
    </div>
  </footer>

  <script src="settings.js"></script>
</body>
</html>
