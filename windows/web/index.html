<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Notes Wallpaper</title>
  <!-- Adapted copy of Resources/web/index.html for the Electron (Windows) app.
       Identical markup: app.js is staged next to this file at build time, and
       the ESM <script> loads over file:// under Electron. web/src is left
       untouched (the macOS WebKit build still uses it). -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      /* The Spot's pink sky, for the edges the dome does not cover. */
      background: linear-gradient(180deg, #f6b9dd 0%, #f3c6e6 45%, #bfeaf4 100%);
    }
    #spot {
      display: block;
      width: 100vw;
      height: 100vh;
      /* Stand-in for the Spot's immersive volume (Bloom, split toning). */
      filter: saturate(1.04) brightness(1.02) contrast(1.02);
    }
  </style>
</head>
<body>
  <canvas id="spot" aria-label="Our Notes Home Spot"></canvas>
  <script type="module" src="app.js"></script>
</body>
</html>
